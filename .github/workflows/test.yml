# 배포는 이 워크플로가 하지 않는다 — Vercel(프론트)·Render(백엔드)의 GitHub 연동이
# push를 받아 알아서 재빌드한다. 여기서 하는 건 그 배포가 나가기 전에 백엔드 테스트를
# 돌려 깨진 게 있으면 먼저 알려주는 것뿐이다.
#
# 시크릿은 필요 없다. app/config.py가 SUPABASE_URL 등을 함수 안에서 읽어서(os.environ[...]이
# import 시점이 아니라 호출 시점) .env 없이도 테스트가 돈다. 만약 나중에 import 시점에
# 환경변수를 요구하게 바뀌면 여기서 먼저 터진다.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Dockerfile의 python:3.11-slim-bookworm과 맞춘다.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # pytest는 requirements.txt에 넣지 않는다 — 그 파일은 배포 이미지의 pip freeze 값이라
      # (파일 상단 주석) 개발 전용 패키지를 섞으면 컨테이너까지 따라 들어간다.
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q