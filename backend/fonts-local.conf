<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  마스터 xlsx가 지정한 독점 글꼴을 자유 글꼴로 치환한다. 이 파일이 없으면 LibreOffice가
  임의로 고른 글꼴로 그려서 한글이 깨지거나 자간이 달라져 표가 어긋난다.

  치환 대상은 재배포가 불가능한 것들뿐이다:
    맑은 고딕 / Malgun Gothic  (MS)        → Noto Sans CJK KR  폭·굵기가 가장 비슷한 자유 글꼴
    굴림체 / Gulim             (MS)        → Noto Sans CJK KR
    Arial                     (Monotype)  → Liberation Sans  자폭이 Arial과 동일하게 설계됨
    Arial Unicode MS          (Monotype)  → Noto Sans CJK KR

  나눔고딕·나눔스퀘어·Pretendard는 Dockerfile에서 진짜 글꼴을 설치하므로 치환하지 않는다.

  글꼴 이름은 fonts-noto-cjk가 실제로 등록하는 패밀리명 그대로여야 한다. "Noto Sans KR"로
  적었더니 그런 이름이 없어 매칭에 실패했고, 기본 sans로 떨어져 일본어판(Noto Sans CJK JP)이
  잡혔다(2026-08-23 컨테이너 검증에서 발견). 한글은 공유 글리프라 보이긴 했지만 틀린 글꼴이다.

  주의: binding="same"이어야 LibreOffice가 문서에 박힌 글꼴 이름을 이 대체본으로 실제 교체한다.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>굴림체</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Gulim</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial Unicode MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>

  <!-- 위 어느 것에도 안 걸린 한글은 Noto Sans CJK KR로 떨어뜨린다 — □□□로 나가는 것만은 막는다. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>